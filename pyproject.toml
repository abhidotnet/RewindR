[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rewindR"
version = "0.1.0"
description = "Lightweight time-travel debugging via sys.settrace and ring-buffered snapshots."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "rewindr contributors" }]
keywords = ["debugging", "tracing", "time-travel", "snapshot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

dependencies = []   # pure stdlib — no runtime deps

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rewindr*"]

[tool.pytest.ini_options]
testpaths = ["rewindr/tests"]
pythonpath = ["."]
