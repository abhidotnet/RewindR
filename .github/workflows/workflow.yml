name: Publish to PyPI

on:
  release:
    types: [published]        # triggers when you publish a GitHub Release
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

jobs:
  # ── 1. Run tests on every supported Python version ────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run tests
        run: pytest rewindr/tests/ -v

  # ── 2. Build source dist + wheel ──────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test              # only build if all tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 3. Publish to PyPI ────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build             # only publish if build succeeded
    environment: pypi        # requires a "pypi" environment in repo settings
    permissions:
      id-token: write        # required for trusted publishing (no API token needed)

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
